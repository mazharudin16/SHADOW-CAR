
name: Build NeonDrift APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NeonDrift_AdminPanel_Integrated.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          unzip -q NeonDrift_AdminPanel_Integrated.zip -d extracted

      - name: Find Gradle project
        run: |
          GRADLE_FILE=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonDrift-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
