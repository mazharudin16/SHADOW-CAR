name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NeonDrift.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        shell: bash
        working-directory: NeonDrift
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: NeonDrift
        run: |
          grep -E '^e:' build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: NeonDrift-apk
          path: NeonDrift/app/build/outputs/apk/debug/app-debug.apk
